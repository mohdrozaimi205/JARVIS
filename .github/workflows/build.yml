name: Bina APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Uji & bina APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Laporan ujian (jika gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-ujian
          path: app/build/reports/tests/

      - name: Namakan APK
        run: cp app/build/outputs/apk/release/app-release.apk JARVIS-v${{ github.run_number }}.apk

      - name: Terbit ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: JARVIS v${{ github.run_number }}
          body: APK JARVIS (Tab Taklimat). Muat turun fail .apk di bawah dan pasang.
          files: JARVIS-v${{ github.run_number }}.apk
